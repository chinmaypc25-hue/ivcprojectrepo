<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="icon" href="assets/icons/icon.png" />
    <!-- fonts & icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-somehash" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="background">
        <div class="bubbles"></div>
        <div class="wave"></div>
    </div>
    <div id="foreground-overlay" class="foreground-overlay"></div>

    <header class="top-bar">
        <div class="url-badge">
            <img src="assets/icons/icon.png" alt="Profile" class="logo-icon" />
            Profile
        </div>
        <div class="search-group">
            <a href="index.html" class="simple-link" title="Back to dashboard"><i class="fas fa-home"></i></a>
        </div>
    </header>

    <main class="container" id="profile-dashboard">
        <section class="card login-card">
            <h2 class="section-title">Your Profile</h2>
            <div class="profile-main">
                <img id="profile-img" src="" alt="Profile" class="profile-avatar" />
                <div class="profile-info">
                    <div class="profile-name" id="profile-name">--</div>
                    <div class="profile-actions">
                        <button id="edit-profile" class="primary-button">Edit Profile</button>
                        <button id="logout-button" class="secondary-button">Logout</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="profile.js"></script>
</body>
</html>
