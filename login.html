<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" href="assets/icons/icon.png" />
    <!-- fonts & icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-somehash" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="background">
        <div class="bubbles"></div>
        <div class="wave"></div>
    </div>
    <div id="foreground-overlay" class="foreground-overlay"></div>

    <header class="top-bar">
        <div class="url-badge">
            <img src="assets/icons/icon.png" alt="Login" class="logo-icon" />
            Login
        </div>
        <div class="search-group">
            <a href="index.html" class="simple-link" title="Back to dashboard"><i class="fas fa-home"></i></a>
        </div>
    </header>

    <main class="container" id="login-dashboard">
        <section class="card login-card">
            <h2 class="section-title">Sign in</h2>
            <div class="form-row">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your name" autocomplete="off" />
            </div>
            <div class="form-row">
                <span>Select a profile image</span>
            </div>
            <div id="profile-grid" class="profile-grid"></div>
            <div class="form-row">
                <button id="login-button" class="primary-button">Login</button>
            </div>
            <div id="login-error" class="form-error"></div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
